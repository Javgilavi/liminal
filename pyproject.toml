[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal"
version = "0.1.0"
description = "Long-horizon dual-arm orchestration on top of FLUX 3 Action for SO-101 / XLeRobot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
hardware = ["lerobot[feetech]", "opencv-python"]
flux = ["torch", "transformers", "peft", "huggingface_hub"]  # VERIFY against BFL docs
sim = ["mujoco>=3"]
perception = ["opencv-python", "numpy"]
llm = ["anthropic", "google-genai"]
ui = ["fastapi", "uvicorn", "httpx"]
maintenance = ["fastapi", "uvicorn", "httpx", "anthropic", "pillow", "opencv-python"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
liminal = "liminal.ui.maintenance:main"
pen-demo = "liminal.ui.maintenance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal = ["ui/web/*.html", "ui/web/*.css", "ui/web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
