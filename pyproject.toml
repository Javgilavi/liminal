[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal"
version = "0.1.0"
description = "Long-horizon dual-arm orchestration on top of FLUX 3 Action for SO-101 / XLeRobot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
hardware = ["lerobot[feetech]==0.5.1", "opencv-python-headless>=4.9,<5"]
live = ["opencv-python-headless>=4.9,<5", "websockets>=15,<17"]
flux = ["torch", "transformers", "peft", "huggingface_hub"]  # VERIFY against BFL docs
sim = ["mujoco>=3"]
perception = ["opencv-python-headless>=4.9,<5", "numpy"]
vlm-qwen = ["torch", "transformers>=4.57,<6", "accelerate", "bitsandbytes>=0.46,<1", "pillow", "numpy"]
llm = ["anthropic", "google-genai"]
hybrid = ["anthropic", "numpy>=1.24", "pillow>=10"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
research = ["liminal[ui,live,sim]", "numpy>=1.26", "pillow>=10"]
dev = ["pytest>=8", "ruff", "httpx>=0.27", "fastapi>=0.115,<1"]

[project.scripts]
liminal = "liminal.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"liminal.ui" = ["static/*", "static/research/*", "static/research/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Keep the local VLM on the CUDA build already used by the deployment laptop.
# The hardware-only setup script deliberately selects CPU torch for .venv-robot.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
