[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal"
version = "0.1.0"
description = "Long-horizon dual-arm orchestration on top of FLUX 3 Action for SO-101 / XLeRobot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
hardware = ["lerobot[feetech]==0.5.1", "opencv-python-headless>=4.9,<5"]
live = ["opencv-python-headless>=4.9,<5", "websockets>=15,<17"]
flux = ["torch", "transformers", "peft", "huggingface_hub"]  # VERIFY against BFL docs
sim = ["mujoco>=3"]
perception = ["opencv-python-headless>=4.9,<5", "numpy"]
llm = ["anthropic", "google-genai"]
hybrid = ["anthropic", "numpy>=1.24"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
dev = ["pytest>=8", "ruff", "httpx>=0.27", "fastapi>=0.115,<1"]

[project.scripts]
liminal = "liminal.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"liminal.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
