# Two SO-101 arms as one 12-D embodiment for option B (bimanual fine-tune).
# Order must match arm_groups.both in configs/robot/so101_dual.yaml.
name: so101_dual
mode: bimanual
groups:
  - name: left_arm
    joints: [left_shoulder_pan, left_shoulder_lift, left_elbow_flex, left_wrist_flex, left_wrist_roll, left_gripper]
  - name: right_arm
    joints: [right_shoulder_pan, right_shoulder_lift, right_elbow_flex, right_wrist_flex, right_wrist_roll, right_gripper]
cameras: {scene: top, left_wrist: left_wrist, right_wrist: right_wrist}
