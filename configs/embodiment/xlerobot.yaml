# XLeRobot: two SO-101-style arms on a mobile base with a pan/tilt head camera.
# VERIFY joint names against the XLeRobot repo / sim assets before converting data.
name: xlerobot
mode: per_arm            # per_arm (reuse single-arm checkpoint per arm) | joint (12-D bimanual fine-tune)
groups:
  - name: left_arm
    joints: [left_shoulder_pan, left_shoulder_lift, left_elbow_flex, left_wrist_flex, left_wrist_roll, left_gripper]
  - name: right_arm
    joints: [right_shoulder_pan, right_shoulder_lift, right_elbow_flex, right_wrist_flex, right_wrist_roll, right_gripper]
  - name: head
    joints: [head_pan, head_tilt]
    policy_controlled: false
  - name: base
    joints: [base_x, base_y, base_theta]
    policy_controlled: false
cameras: {scene: head, left_wrist: left_wrist, right_wrist: right_wrist}
