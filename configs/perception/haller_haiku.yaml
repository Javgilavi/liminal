# Scene predicates on the Haller from ws4's measured Claude Haiku checks (src/liminal/ws4_bridge/vision.py), instead of
# the local Qwen3-VL-4B (configs/perception/component_assembly.yaml, CUDA, unmeasured on Haller frames). Each predicate
# uses the tuned prompt of the ws4 skill that decides it; held out on recorded Haller head frames: lid 63/63, green pen
# 114/119, cutter 91/91, red pen 65/66 (ws4/research/orchestrator.md). Needs an Anthropic API key.
#
# Semantics differ slightly from the definitions below (kept for the task files and the Qwen path): the ws4 checks
# accept a gripper still touching the object, and the red pen step ends holding the pen at its slot.
model:
  provider: ws4_haiku
  scene_camera: top   # the checks were tuned on the head camera only
  budget_usd: 2.0
  checks:
    lid_open: open_box
    green_pen_in_slot: put_green_pen_in_slot
    yellow_boxcutter_in_slot: put_yellow_cutter_in_slot
    red_pen_in_slot: put_pen_in_slot
  derived:
    components_assembled: [green_pen_in_slot, red_pen_in_slot, yellow_boxcutter_in_slot]
inspection:
  cameras: [top]
  confirmations: 2
  # A WHILE re-checks its invariant every timeout_s / 3 and treats evidence older than timeout_s as broken; a Haiku
  # check takes about 1.3 s (up to a few s), so 15 s leaves margin.
  timeout_s: 15
  retry_delay_s: 0.1
  definitions:
    lid_open: The box lid is open far enough for the left arm to reach every component slot safely.
    green_pen_in_slot: The green pen is seated in its own slot and released by the gripper.
    red_pen_in_slot: The red pen is seated in its own slot and released by the gripper.
    yellow_boxcutter_in_slot: The yellow boxcutter is seated in its own slot and released by the gripper.
    components_assembled: The green pen, red pen and yellow boxcutter are all seated in their respective slots, with
      none still held by a gripper.
