# HISTORICAL / SUPERSEDED: original unified embodiment fine-tune, not the current LoRA runtime.
# Retained for compatibility and mock tests; no validated 12-D checkpoint is supplied.
# Option B in PLAN.md: ONE model fine-tuned on both arms together (12-D actions).
# Skills target the `both` arm group (see arm_groups in configs/robot/so101_dual.yaml).
# Proposed output of the original WS4 plan; this checkpoint was not produced.
checkpoint: outputs/bimanual/flux3_dual_v1   # historical placeholder, not a deployment path
device: cuda
dtype: bfloat16
action_dim: 12           # [left 6 | right 6], same order as arm_groups.both
chunk_size: 42           # VERIFY (inherit from base checkpoint unless retrained)
execute_steps: 32        # VERIFY
control_hz: 30.0         # VERIFY
obs_history: 8           # VERIFY
camera_roles: [scene, left_wrist, right_wrist]
camera_map:
  both: {scene: top, left_wrist: left_wrist, right_wrist: right_wrist}
lora_adapter: null
