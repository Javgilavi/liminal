# FLUX 3 Action, SO-101 checkpoint - option A (per-arm) in PLAN.md.
# Source: HF model card + docs.bfl.ai/flux_3/flux3_action_so101 (read 2026-10-17). Gated: accept the FLUX Kommunity
# License on the model page, then `hf auth login`. Weights are model.safetensors (13.9 GB, BF16), not a .pt; the
# frozen encoders (Qwen3-VL-4B text encoder 8.9 GB + video VAE 2.5 GB) come from the base repo. Loaded through
# LeRobot main: lerobot.policies.flux3.Flux3Policy.from_pretrained(checkpoint) + make_pre_post_processors.
checkpoint: black-forest-labs/flux-3-action-so101
checkpoint_revision: c9e13b2aca6a0a472b3ea03fd90cff32d3e85849
encoders: black-forest-labs/flux-3-action-base
encoders_revision: 62878e2925e59b7a89ec14463ce89932624c490d
device: cuda
dtype: bfloat16          # VERIFY on first run: docs report ~32 GB GPU memory for BF16 inference
action_dim: 6            # shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll (deg), gripper (0-100)
chunk_size: 42           # model card: predict 42
execute_steps: 32        # model card: execute 32, then replan
control_hz: 30.0         # model card: 30 Hz
obs_history: 8           # model card: eight observations (two visual snapshots + past commands)
camera_roles: [scene, wrist]   # checkpoint keys observation.images.scene / .wrist, 256x256 each -> 512x256 canvas
camera_map:
  right: {scene: top, wrist: right_wrist}
  left:  {scene: top, wrist: left_wrist}
lora_adapter: null       # e.g. outputs/lora/pick_place_v1 after WS1 fine-tuning
arm_adapters: {}         # A1 + per-arm LoRA, e.g. {left: outputs/lora/left_v1, right: outputs/lora/right_v1}
instances: shared        # shared = A1 (one model, single-flight) | per_arm = A2 (one model per arm, ~2x VRAM)
devices: {}              # A2 only, e.g. {left: "cuda:0", right: "cuda:1"}
