# Board serials observed 2026-10-17. USB serial identifies the board; re-check physical sides after rewiring.
# ROBOT frame (the robot's own left/right, as in every task file and policy registry: `left` = the pen arm that places
# the components, `right` = the box helper). Per /etc/udev/rules.d/99-haller-devices.rules on the Haller laptop,
# 5B14030445 is /dev/haller_arm_right (operator frame) = the ROBOT's LEFT arm, and 5B79018460 is /dev/haller_arm_left =
# the ROBOT's RIGHT arm. The first version of this file had them the other way round (operator frame): with the
# task files, the pen skills would have driven the box arm. Calibration ids keep their original file names.
# The Haller runs through the ws4 bridge instead (configs/robot/haller_ws4.yaml, ws4/HARNESS_BRIDGE.md): that path
# keeps the Haller safety stack and freezes with torque on at an e-stop.
name: xlerobot
arms:
  left:
    type: so101
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B14030445-if00
    id: xlerobot_right_5B14030445
    max_relative_target: 2
    max_speed: 20
    temperature_limit: 55
  right:
    type: so101
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B79018460-if00
    id: xlerobot_left_5B79018460
    max_relative_target: 2
    max_speed: 20
    temperature_limit: 55
arm_groups:
  both: [left, right]
# Software limits intersect the calibration read from each arm. Wrist roll is
# deliberately restricted: stored ranges span ~360 degrees and are unreliable
# near their extremes. VERIFY physical endpoints before expanding this window.
limits:
  left:  {lower: [-130, -120, -120, -120, -90, 0], upper: [130, 120, 120, 120, 90, 100], max_step: 2}
  right: {lower: [-130, -120, -120, -120, -90, 0], upper: [130, 120, 120, 120, 90, 100], max_step: 2}
cameras:
  # D455 RGB interface, not its depth/infrared video nodes. Port-specific:
  # update after moving the camera to a different USB connector.
  top:
    type: opencv
    index: /dev/v4l/by-path/pci-0000:06:00.3-usb-0:2:1.3-video-index0
    width: 640
    height: 480
    label: Scene
  # VERIFY physical arm assignment before mapping either camera to a policy.
  wrist_a:
    type: opencv
    fourcc: MJPG
    label: Wrist A (arm unverified)
    index: /dev/v4l/by-path/pci-0000:06:00.3-usb-0:1.2:1.0-video-index0
    width: 640
    height: 480
    fps: 30
    rotation: 180
  wrist_b:
    type: opencv
    fourcc: MJPG
    label: Wrist B (arm unverified)
    index: /dev/v4l/by-path/pci-0000:06:00.3-usb-0:1.3:1.0-video-index0
    width: 640
    height: 480
    fps: 30
    rotation: 180
# No home pose or guessed base geometry: measure before autonomous bimanual work.
