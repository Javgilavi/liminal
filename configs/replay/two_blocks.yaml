# V1/V3 baseline: two distinct obligations, interrupt after the first, resume with the second.
name: two_blocks
goal:
  id: goal-two-blocks
  text: Put the red and blue blocks in the box
  obligations: [red_in_box, blue_in_box]
objects:
  red: red block
  blue: blue block
  box: white box
obligations:
  red_in_box: {object_id: red, destination_id: box}
  blue_in_box: {object_id: blue, destination_id: box}
initial_locations: {red: table, blue: table}
capabilities:
  version: replay-v1
  available_arms: [left, right]
  skills:
    pick_place:
      arms: [left, right]
      effect_templates: ["{object_id}_in_{destination_id}"]
      prompt_template: "Pick up the {object_label} and place it inside the {destination_label}."
      max_timeout_s: 15
      max_attempts: 2
