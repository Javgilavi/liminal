# Open workbench for free-text goals (`liminal episode ... --goal "..."` and the web UI).
# The goal below is only the default; a grounded operator goal replaces it before the run.
name: workbench
goal:
  id: goal-workbench-default
  text: Put the red block in the box
  obligations: [red_in_box]
objects:
  red: red block
  blue: blue block
  green: green block
  box: white box
  left_bin: left bin
  right_bin: right bin
obligations:
  red_in_box: {object_id: red, destination_id: box}
initial_locations: {red: table}
capabilities:
  version: replay-v1
  available_arms: [left, right]
  skills:
    pick_place:
      arms: [left, right]
      effect_templates: ["{object_id}_in_{destination_id}"]
      prompt_template: "Pick up the {object_label} and place it inside the {destination_label}."
      max_timeout_s: 15
      max_attempts: 2
