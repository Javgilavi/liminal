<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liminal operator console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf8f4; --panel: #ffffff; --panel2: #f7f5fc; --line: #ece8f3; --line2: #ddd7ea;
    --text: #1c1830; --muted: #6e6984; --faint: #a19cb4;
    --left: #6c4cf5; --left-soft: #efebff; --right: #ff6a3d; --right-soft: #fff0ea;
    --blue: #2f7cf6; --blue-soft: #e8f1ff; --green: #0fb57f; --green-soft: #e3f8f0;
    --red: #ef3b4f; --red-soft: #ffe9ec; --amber: #f2a20c; --amber-soft: #fff4dc;
    --teal: #10b3b3; --pink: #ec4fa6; --yellow: #f6c33a;
    --shadow: 0 1px 2px rgba(40, 24, 90, .05), 0 8px 24px rgba(40, 24, 90, .06);
    --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); min-height: 100vh;
    background-image:
      radial-gradient(900px 420px at -5% -10%, #ece6ff 0%, transparent 60%),
      radial-gradient(800px 380px at 105% -5%, #ffe6da 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 110%, #dcf7ee 0%, transparent 60%);
    background-attachment: fixed;
  }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px;
           padding: 8px 14px; cursor: pointer; font-weight: 600; transition: transform .08s, box-shadow .15s, background .15s; }
  button:hover:not(:disabled) { box-shadow: var(--shadow); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .4; cursor: default; }

  /* header */
  header { position: sticky; top: 0; z-index: 10; background: rgba(255, 255, 255, .78); backdrop-filter: blur(14px);
           -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); transition: background .2s; }
  header:has(#estop.latched) { background: rgba(255, 233, 236, .92); border-bottom-color: #ffc2ca; }
  .bar1 { display: flex; align-items: center; gap: 12px; padding: 12px 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.4px; }
  .logo { width: 30px; height: 30px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 6px;
          background: linear-gradient(135deg, var(--left), var(--pink) 55%, var(--right)); }
  .logo i { background: rgba(255, 255, 255, .92); border-radius: 3px; }
  .logo i:last-child { opacity: .55; }
  .brand small { font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .2px; margin-left: 2px; }
  .state { font-weight: 700; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; padding: 5px 12px 5px 10px;
           border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; }
  .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .s-idle { background: var(--panel2); color: var(--muted); border-color: var(--line); }
  .s-ready { background: var(--left-soft); color: var(--left); }
  .s-running { background: var(--blue-soft); color: var(--blue); } .s-running::before { animation: blink 1s infinite; }
  .s-succeeded { background: var(--green-soft); color: var(--green); }
  .s-failed, .s-aborted, .s-estopped { background: var(--red-soft); color: var(--red); }
  .s-paused, .s-awaiting_replan { background: var(--amber-soft); color: #b77700; }
  @keyframes blink { 50% { opacity: .25; } }
  .spacer { flex: 1; }
  .ctl { display: flex; gap: 8px; align-items: center; }
  #estop { background: linear-gradient(135deg, #ff4d5e, #e1123a); color: #fff; border: 0; border-radius: 16px; padding: 12px 22px;
           font-size: 16px; font-weight: 800; letter-spacing: .8px; display: inline-flex; align-items: center; gap: 10px;
           box-shadow: 0 6px 20px rgba(239, 59, 79, .35), inset 0 -2px 0 rgba(0, 0, 0, .12); }
  #estop:hover { box-shadow: 0 10px 28px rgba(239, 59, 79, .45); }
  #estop svg { width: 20px; height: 20px; }
  #estop.latched { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(239, 59, 79, .22), 0 6px 20px rgba(239, 59, 79, .4); } }
  kbd { font: 600 11px var(--mono); background: rgba(255, 255, 255, .25); border-radius: 6px; padding: 2px 6px; }
  .bar2 { display: flex; align-items: center; gap: 8px; padding: 0 22px 12px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
          color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip b { color: var(--text); font-weight: 700; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  #cfg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  #cost { font-family: var(--mono); color: var(--text); background: linear-gradient(90deg, #fff7d6, #ffe9f3); border-color: #f5dcb0; }

  /* layout */
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; padding: 18px 22px 30px;
         max-width: 1600px; margin: 0 auto; }
  @media (max-width: 1050px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px;
            margin-bottom: 18px; box-shadow: var(--shadow); }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px;
               font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  section h2 .dot { width: 10px; height: 10px; border-radius: 4px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .err { color: var(--red); }
  textarea { width: 100%; min-height: 70px; resize: vertical; background: var(--panel2); color: var(--text);
             border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font: 500 15px/1.45 var(--sans); }
  textarea:focus { outline: none; border-color: var(--left); box-shadow: 0 0 0 4px var(--left-soft); background: #fff; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  input[type=number] { width: 70px; background: var(--panel2); color: var(--text); border: 1.5px solid var(--line);
                       border-radius: 10px; padding: 7px 8px; font: 600 13px var(--mono); }
  label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .primary { background: linear-gradient(135deg, #7a5cff, #5b3cf0); color: #fff; border: 0; padding: 10px 22px;
             box-shadow: 0 6px 16px rgba(108, 76, 245, .30); }
  .go { background: linear-gradient(135deg, #22d39a, #0fb57f); color: #fff; border: 0; padding: 11px 22px; font-size: 15px;
        box-shadow: 0 6px 16px rgba(15, 181, 127, .30); }

  /* plan lanes */
  .rationale { font-size: 13.5px; color: #4b4662; margin: 2px 0 12px; padding: 10px 12px; border-radius: 12px;
               background: linear-gradient(90deg, var(--left-soft), var(--right-soft)); }
  .rationale:empty { display: none; }
  .lanes { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); gap: 10px 0; }
  .lanehead { font-weight: 800; text-transform: uppercase; font-size: 12px; letter-spacing: .9px; padding: 6px 12px;
              border-radius: 10px; display: flex; align-items: center; gap: 8px; }
  .lanehead::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .lanehead.left { color: var(--left); background: var(--left-soft); }
  .lanehead.right { color: var(--right); background: var(--right-soft); }
  .par { display: flex; align-items: center; justify-content: center; }
  .par span { font: 800 15px var(--sans); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
              background: linear-gradient(135deg, var(--left), var(--right)); box-shadow: 0 4px 12px rgba(236, 79, 166, .3); }
  .cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card { border: 1.5px solid var(--line); border-radius: 16px; padding: 11px 13px 11px 16px; background: #fff; min-width: 0;
          position: relative; transition: box-shadow .2s, border-color .2s; }
  .card::before { content: ""; position: absolute; left: 5px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px;
                  background: var(--armc, var(--faint)); }
  .card.arm-left { --armc: var(--left); } .card.arm-right { --armc: var(--right); }
  .card.running { border-color: #b9d3ff; box-shadow: 0 0 0 4px var(--blue-soft); }
  .card.done { background: linear-gradient(180deg, #fff, #f3fcf8); border-color: #bfeedd; }
  .card.failed { background: var(--red-soft); border-color: #ffc2ca; }
  .card.interrupted { background: var(--amber-soft); border-color: #f8dd9e; }
  .card.proposed { border-style: dashed; border-color: var(--line2); }
  .card .t { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 800; }
  .card .t > span:first-child { overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 13px; }
  .card .st { font: 700 10.5px var(--sans); text-transform: uppercase; letter-spacing: .6px; padding: 3px 8px; border-radius: 999px;
              background: var(--panel2); color: var(--muted); white-space: nowrap; }
  .card.running .st { background: var(--blue-soft); color: var(--blue); }
  .card.done .st { background: var(--green-soft); color: var(--green); }
  .card.failed .st { background: #fff; color: var(--red); }
  .card.interrupted .st { background: #fff; color: #b77700; }
  .card .p { font-size: 13px; margin-top: 5px; color: #3a3550; word-break: break-word; }
  .card .p b { color: var(--armc, var(--text)); font-weight: 700; }
  .card .c { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card .v { font-size: 12px; margin-top: 7px; padding: 6px 8px; border-radius: 10px; background: var(--green-soft); color: #08744f; }
  .card .v.no { background: var(--panel2); color: #5d5874; }
  .card .bar { height: 6px; background: var(--panel2); border-radius: 6px; margin-top: 7px; overflow: hidden; }
  .card .bar > div { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--blue), var(--teal)); }
  .ov { display: flex; gap: 6px; margin-top: 8px; } .ov button { padding: 3px 10px; font-size: 11px; border-radius: 8px; }
  .kind-primitive .p { color: var(--teal); }
  .kind-hold { background: repeating-linear-gradient(135deg, #fff, #fff 8px, var(--panel2) 8px, var(--panel2) 16px); }
  .banner { padding: 11px 14px; border-radius: 14px; margin-bottom: 12px; font-weight: 600; }
  .banner.estop { background: var(--red-soft); color: #b3172b; border: 1.5px solid #ffc2ca; }
  .banner.replan { background: var(--amber-soft); color: #8a5a00; border: 1.5px solid #f8dd9e; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 26px 10px; color: var(--muted); border: 1.5px dashed var(--line2);
           border-radius: 16px; background: var(--panel2); }
  .approve-row { justify-content: space-between; }
  .approve-row .muted { max-width: 520px; }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .tile { border-radius: 14px; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); min-width: 0; }
  .tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; }
  .tile .v { font-size: 14px; font-weight: 700; margin-top: 3px; word-break: break-word; }
  .tile.c0 { background: var(--left-soft); border-color: #ddd3ff; } .tile.c1 { background: var(--right-soft); border-color: #ffd9cb; }
  .tile.c2 { background: var(--blue-soft); border-color: #cfe1ff; } .tile.c3 { background: var(--green-soft); border-color: #c4eedd; }
  .tile.c4 { background: #fff7d6; border-color: #f5e3a6; } .tile.c5 { background: #ffe9f5; border-color: #f9cde5; }

  /* cameras + log */
  .cams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cams figure { margin: 0; position: relative; border-radius: 16px; padding: 3px; }
  .cams figure.head { grid-column: span 2; background: linear-gradient(135deg, var(--left), var(--pink), var(--right)); }
  .cams figure.lw { background: var(--left); } .cams figure.rw { background: var(--right); }
  .cams img { width: 100%; border-radius: 13px; display: block; aspect-ratio: 4 / 3; object-fit: cover; background: #e9e6f2; }
  figcaption { position: absolute; left: 12px; top: 12px; font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .6px;
               padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: var(--text); }
  figure.lw figcaption { color: var(--left); } figure.rw figcaption { color: var(--right); }
  #log { height: 320px; overflow: auto; font: 12px/1.55 var(--mono); background: #fcfbff; border-radius: 14px; padding: 8px 10px;
         border: 1px solid var(--line); }
  #log div { white-space: pre-wrap; word-break: break-word; padding: 2px 0 2px 14px; position: relative; }
  #log div::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  #log .l-error { color: #c01d33; } #log .l-error::before { background: var(--red); }
  #log .l-warn { color: #9a6300; } #log .l-warn::before { background: var(--amber); }
  #log .l-info { color: #2f2a45; } #log .l-info::before { background: var(--blue); }
  #log .l-debug { color: var(--faint); }

  @media (max-width: 640px) {
    .bar1, .bar2 { padding-left: 14px; padding-right: 14px; } main { padding: 14px; }
    .ctl { width: 100%; } #estop { flex: 1; justify-content: center; }
    .lanes { grid-template-columns: 1fr; } .par { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar1">
    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>liminal <small>operator console</small></div>
    <span id="state" class="state s-idle">idle</span>
    <span class="spacer"></span>
    <div class="ctl">
      <button id="release" title="Release the e-stop latch">Release</button>
      <button id="resume" title="Restart interrupted steps">Resume</button>
      <button id="abort" title="Stop the run and log it as aborted">Abort</button>
      <button id="estop" title="Stop both arms (spacebar)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M8.2 2.5h7.6l5.7 5.7v7.6l-5.7 5.7H8.2l-5.7-5.7V8.2z"/><path d="M12 7.5v6M12 16.5v.5" stroke-linecap="round"/></svg>E-STOP <kbd>space</kbd></button>
    </div>
  </div>
  <div class="bar2"><span id="cfg"></span><span class="spacer"></span><span class="chip" id="cost">USD 0.0000</span></div>
</header>
<main>
  <div>
    <section>
      <h2><span class="dot" style="background:var(--left)"></span>Goal</h2>
      <textarea id="goal" placeholder="Describe the task, e.g. put the apple and the yellow block in the box, then close the lid">put the apple and the yellow block in the box, then close the lid</textarea>
      <div class="row">
        <button class="primary" id="planbtn">Plan</button>
        <span id="planstatus" class="muted small"></span>
        <span class="spacer"></span>
        <span id="simctl" class="row" style="margin:0">
          <span class="muted small">sim seed</span><input type="number" id="seed" value="0">
          <label class="small muted"><input type="checkbox" id="lidonbox"> lid on box</label>
          <button id="reset">Reset scene</button>
        </span>
      </div>
    </section>
    <section>
      <h2><span class="dot" style="background:linear-gradient(135deg,var(--left),var(--right))"></span>Plan <span id="planmeta" class="muted small" style="text-transform:none;letter-spacing:0;font-weight:600"></span></h2>
      <div id="banners"></div>
      <div id="rationale" class="rationale"></div>
      <div id="errors" class="err small"></div>
      <div id="lanes" class="lanes"></div>
      <div class="row approve-row">
        <span class="muted small">A human approves every plan. Claude only picks skills from the vocabulary; nothing it writes reaches the motors.</span>
        <button class="go" id="approve" disabled>Approve and run</button>
      </div>
    </section>
    <section>
      <h2><span class="dot" style="background:var(--blue)"></span>Run</h2>
      <div class="tiles" id="runkv"></div>
    </section>
  </div>
  <div>
    <section>
      <h2><span class="dot" style="background:var(--pink)"></span>Cameras</h2>
      <div class="cams">
        <figure class="head"><img id="cam-head" alt="head camera"><figcaption>head camera</figcaption></figure>
        <figure class="lw"><img id="cam-left_wrist" alt="left wrist camera"><figcaption>left wrist</figcaption></figure>
        <figure class="rw"><img id="cam-right_wrist" alt="right wrist camera"><figcaption>right wrist</figcaption></figure>
      </div>
    </section>
    <section id="imaginesec" style="display:none">
      <h2><span class="dot" style="background:var(--yellow)"></span>Imagined vs actual</h2>
      <div class="cams">
        <figure class="lw"><img id="cam-imagined" alt="imagined"><figcaption>FLUX imagined</figcaption></figure>
        <figure class="rw"><img id="cam-actual" alt="actual"><figcaption>actual</figcaption></figure>
      </div>
    </section>
    <section>
      <h2><span class="dot" style="background:var(--teal)"></span>Events</h2>
      <div id="log"></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let S = null, lastSeq = 0, proposalVersion = null, seedSynced = false;
const TERMINAL = ["succeeded", "failed", "aborted"];

async function post(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-HMI": "1" }, body: JSON.stringify(body) });
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok && data.message) addLocal("warn", data.message);
  if (!r.ok && data.error) addLocal("warn", data.error);
  return data;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function addLocal(level, msg) { const d = document.createElement("div"); d.className = "l-" + level; d.textContent = "(hmi) " + msg; $("log").appendChild(d); $("log").scrollTop = 1e9; }

function estop() { $("estop").classList.add("latched"); post("/api/estop"); }
$("estop").onclick = estop;
$("release").onclick = () => post("/api/release");
$("resume").onclick = () => post("/api/resume");
$("abort").onclick = () => { if (confirm("Abort the run? It is logged as an aborted attempt.")) post("/api/abort"); };
$("planbtn").onclick = () => post("/api/plan", { goal: $("goal").value });
$("approve").onclick = () => { if (proposalVersion != null) post("/api/approve", { version: proposalVersion }); };
$("reset").onclick = () => post("/api/reset", { seed: $("seed").value, lid_on_box: $("lidonbox").checked });
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space") return;
  const running = S && S.run && !TERMINAL.includes(S.run.state);
  const typing = document.activeElement && ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName);
  if (running || !typing) { e.preventDefault(); estop(); }
});

function card(st, isRun) {
  const kind = st.skill === "hold" ? "kind-hold" : "kind-" + (st.kind || "flux");
  const status = st.status || "proposed";
  let html = `<div class="card ${status} ${kind} arm-${esc(st.arm)}"><div class="t"><span>${esc(st.id)}</span><span class="st">${esc(status)}${st.attempt ? " " + st.attempt + "/" + st.max_attempts : ""}</span></div>`;
  if (st.skill === "hold") html += `<div class="p">holds until <b>${esc((st.hold_until || []).join(", "))}</b> are done</div>`;
  else if (st.kind === "primitive") html += `<div class="p">scripted: <b>${esc(st.skill)}</b></div>`;
  else html += `<div class="p"><b>FLUX</b> "${esc(st.prompt || "")}"</div>`;
  if (st.success_check) html += `<div class="c">check: ${esc(st.success_check)}</div>`;
  if (st.depends_on && st.depends_on.length) html += `<div class="c">after ${esc(st.depends_on.join(", "))}</div>`;
  if (isRun && status === "running") {
    const pct = Math.min(100, 100 * (st.elapsed_s || 0) / (st.timeout_s || 1));
    html += `<div class="c">${(st.elapsed_s || 0).toFixed(1)} s of ${st.timeout_s} s, ${st.chunks} chunks${st.phase ? ", " + esc(st.phase) : ""}${st.verifying ? ", checking..." : ""}</div><div class="bar"><div style="width:${pct}%"></div></div>`;
  }
  if (isRun && st.last_verdict) {
    const v = st.last_verdict;
    html += `<div class="v ${v.done ? "" : "no"}">${v.done ? "&#10003;" : "&#8230;"} ${esc(v.source)} (${(v.confidence ?? 0).toFixed(2)}): ${esc(v.observation)}</div>`;
  }
  if (isRun && st.reason && status !== "done") html += `<div class="c err">${esc(st.reason)}</div>`;
  if (isRun && status !== "done" && S.run && !TERMINAL.includes(S.run.state))
    html += `<div class="ov"><button onclick="post('/api/override',{step:'${esc(st.id)}',done:true})">mark done</button><button onclick="post('/api/override',{step:'${esc(st.id)}',done:false})">mark failed</button></div>`;
  return html + "</div>";
}

function renderLanes(steps, levels, pairs, isRun) {
  const lanes = $("lanes");
  if (!steps || !steps.length) { lanes.innerHTML = '<div class="empty">No plan yet. Type a goal and press <b>Plan</b>.</div>'; return; }
  const lv = (s) => (levels && levels[s.id] != null) ? levels[s.id] : (s.level ?? 0);
  const maxL = Math.max(...steps.map(lv));
  const pairSet = new Set((pairs || []).map(p => p[0] + "|" + p[1]));
  let html = '<div class="lanehead left">left arm</div><div></div><div class="lanehead right">right arm</div>';
  for (let l = 0; l <= maxL; l++) {
    const L = steps.filter(s => s.arm === "left" && lv(s) === l), R = steps.filter(s => s.arm === "right" && lv(s) === l);
    const conc = L.some(a => R.some(b => pairSet.has(a.id + "|" + b.id)));
    html += `<div class="cell">${L.map(s => card(s, isRun)).join("")}</div>`;
    html += `<div class="par" title="${conc ? "runs in parallel" : ""}">${conc ? "<span>&#8741;</span>" : ""}</div>`;
    html += `<div class="cell">${R.map(s => card(s, isRun)).join("")}</div>`;
  }
  lanes.innerHTML = html;
}

function tiles(rows) { return rows.map(([k, v], i) => `<div class="tile c${i % 6}"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`).join(""); }

function render() {
  if (!S) return;
  const c = S.config;
  const dots = { env: "var(--teal)", policy: "var(--left)", planner: "var(--pink)", verifier: "var(--right)", gate: "var(--green)" };
  $("cfg").innerHTML = [["env", c.env], ["policy", c.policy], ["planner", c.planner_model || c.planner], ["verifier", c.verifier], ["gate", c.gate ? "on" : "off"]]
    .map(([k, v]) => `<span class="chip"><i style="background:${dots[k]}"></i>${k} <b>${esc(v)}</b></span>`).join("");
  $("simctl").style.display = c.env === "sim" ? "" : "none";
  if (!seedSynced && c.seed != null && document.activeElement !== $("seed")) { $("seed").value = c.seed; $("lidonbox").checked = !!c.lid_on_box; seedSynced = true; }
  const run = S.run, active = run && !TERMINAL.includes(run.state), p = S.proposal;
  let state = S.estopped && !active ? "estopped" : (run ? run.state : "idle");
  if (!active && !S.estopped && p && p.ok) state = "ready";
  $("state").textContent = state === "ready" ? "plan ready" : state.replace("_", " "); $("state").className = "state s-" + state;
  $("estop").classList.toggle("latched", !!S.estopped);
  $("release").disabled = !S.estopped; $("resume").disabled = !(run && run.state === "paused"); $("abort").disabled = !active;
  const cost = S.cost; $("cost").textContent = `Claude USD ${cost.total_usd.toFixed(4)} / ${cost.budget_usd.toFixed(2)}`;
  $("planbtn").disabled = S.planning || active; $("goal").disabled = active;
  $("planstatus").textContent = S.planning ? "planning..." : "";
  let banners = "";
  if (S.estopped) banners += `<div class="banner estop">&#9888; E-STOP latched: both arms hold their last command. Release, then Resume or Abort.</div>`;
  if (run && run.state === "awaiting_replan") banners += `<div class="banner replan">&#8635; A step failed. ${p && p.kind === "replan" ? "Claude proposed a new plan below: approve it to continue." : "Waiting for the planner..."}</div>`;
  $("banners").innerHTML = banners;
  if (p && (!active || p.kind === "replan")) {
    proposalVersion = p.ok ? p.version : null;
    $("approve").disabled = !p.ok || (p.kind === "plan" && active);
    $("approve").textContent = p.kind === "replan" ? "Approve replan and continue" : "Approve and run";
    $("planmeta").textContent = `v${p.version} from ${p.source}, ${p.attempts} attempt(s), ${p.latency_s} s, USD ${p.cost_usd.toFixed(4)}` + (p.concurrent_pairs && p.concurrent_pairs.length ? `, ${p.concurrent_pairs.length} parallel pair(s)` : "");
    $("rationale").textContent = p.plan ? (p.plan.rationale || "") : "";
    $("errors").innerHTML = (p.errors || []).map(e => "&#9888; " + esc(e)).join("<br>");
    const steps = p.plan ? p.plan.steps.map(s => ({ ...s, kind: (S.vocabulary.find(v => v.name === s.skill) || {}).kind, prompt: (S.vocabulary.find(v => v.name === s.skill) || {}).prompt })) : [];
    renderLanes(steps, p.levels, p.concurrent_pairs, false);
  } else if (run) {
    proposalVersion = null; $("approve").disabled = true; $("approve").textContent = "Approve and run";
    $("planmeta").textContent = `running plan v${run.plan_version}`; $("errors").innerHTML = ""; $("rationale").textContent = "";
    renderLanes(run.steps, null, run.concurrent_pairs, true);
  } else { proposalVersion = null; $("approve").disabled = true; renderLanes([], null, [], false); }
  const rows = [];
  if (run) {
    const cc = run.concurrency || {};
    const both = cc.active_ticks ? (100 * cc.both_arms_moving_ticks / cc.active_ticks).toFixed(0) + "%" : "-";
    rows.push(["run", esc(run.state.replace("_", " ")) + (run.failure ? ` <span class="err">${esc(run.failure)}</span>` : "")],
      ["active time", `${run.t.toFixed(1)} s, ${run.tick} ticks`], ["both arms moving", both],
      ["arms", `<span style="color:var(--left)">L</span> ${esc(run.arms.left || "idle")}<br><span style="color:var(--right)">R</span> ${esc(run.arms.right || "idle")}`],
      ["interventions / replans", `${run.interventions} / ${run.replans}`]);
    for (const [t, l] of Object.entries(cc.latency_s || {})) rows.push([`chunk latency ${t}`, `median ${l.median.toFixed(2)} s, max ${l.max.toFixed(2)} s`]);
  }
  if (S.gate) rows.push(["collision gate", `${S.gate.chunks} chunks, ${S.gate.truncated} truncated, ${S.gate.refused} refused, ${S.gate.ms_per_frame ?? "-"} ms/frame`]);
  for (const [k, v] of Object.entries(cost.by_purpose || {})) rows.push([`Claude ${k}`, `${v.calls} calls, USD ${v.cost_usd.toFixed(4)}, median ${v.median_latency_s?.toFixed(1)} s`]);
  if (S.last_result && S.last_result.trial) { const t = S.last_result.trial; rows.push(["last trial", `${esc(t.task)}/${esc(t.variant)} #${t.attempt}: ${t.steps_done}/${t.steps_total} steps, ${t.success ? "success" : "fail"}`]); }
  $("runkv").innerHTML = rows.length ? tiles(rows) : '<div class="empty">Nothing has run yet.</div>';
  const log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  for (const e of S.events) {
    if (e.seq <= lastSeq) continue; lastSeq = e.seq;
    const d = document.createElement("div"); d.className = "l-" + e.level;
    d.textContent = new Date(e.time * 1000).toLocaleTimeString() + "  " + e.msg; log.appendChild(d);
  }
  while (log.childElementCount > 600) log.removeChild(log.firstChild);
  if (stick) log.scrollTop = 1e9;
}

async function poll() {
  try { const r = await fetch("/api/state"); S = await r.json(); render(); } catch (e) {}
  setTimeout(poll, 300);
}
function cams() {
  const t = Date.now();
  for (const n of ["head", "left_wrist", "right_wrist"]) { const img = new Image(); img.onload = () => { $("cam-" + n).src = img.src; }; img.src = `/api/frame/${n}.jpg?t=${t}`; }
  setTimeout(cams, 250);
}
poll(); cams();
</script>
</body>
</html>
